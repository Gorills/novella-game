<path d="M510 580L721 420h605l88 160v238H510z" fill="#070a0f"/>
<path d="M730 420v398M1000 420v398M1268 420v398" stroke="#151a22" stroke-width="5"/>
<!-- road -->
<path d="M0 720L1920 662v418H0z" fill="url(#road)"/>
<path d="M0 830L1920 740M0 1004l1920-124" stroke="#252c34" stroke-width="3" opacity=".8"/>
<!-- puddles/reflections -->
<g fill="#6a82a1" opacity=".11"><ellipse cx="390" cy="876" rx="260" ry="50"/><ellipse cx="1195" cy="826" rx="330" ry="58"/><ellipse cx="1600" cy="950" rx="240" ry="42"/></g>
<g stroke="#7596be" stroke-opacity=".19" stroke-width="3"><path d="M231 865h320M1005 817h401M1460 940h304"/></g>
<!-- street lamps -->
<g><rect x="596" y="276" width="11" height="466" fill="#20252c"/><path d="M601 292h102" stroke="#20252c" stroke-width="10"/><ellipse cx="703" cy="296" rx="32" ry="18" fill="#e1bd86" opacity=".7"/><path d="M703 307L596 716h216z" fill="#deb577" opacity=".06"/></g>
<g><rect x="1310" y="220" width="11" height="526" fill="#20252c"/><path d="M1315 238h-100" stroke="#20252c" stroke-width="10"/><ellipse cx="1214" cy="241" rx="32" ry="18" fill="#d8b47f" opacity=".68"/><path d="M1214 253l-92 466h196z" fill="#d9b578" opacity=".05"/></g>
<!-- cordon clues -->
<g opacity=".9"><path d="M540 735l760-22" stroke="#c9a63b" stroke-width="18"/><path d="M540 735l760-22" stroke="#2b2410" stroke-width="2" stroke-dasharray="42 30"/><text x="845" y="724" fill="#17140c" font-family="Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="5">НЕ ПЕРЕСЕКАТЬ · POLICE LINE</text></g>
<!-- subtle ground sigil -->
<g transform="translate(925 820)" stroke="#9a3555" stroke-width="5" fill="none" opacity=".72"><circle r="48"/><circle r="13"/><path d="M0-48v96M-48 0h96M-34-34l68 68M34-34l-68 68"/></g>
<!-- police light reflection -->
<rect width="1920" height="1080" fill="url(#blue)"/><rect width="1920" height="1080" fill="url(#red)"/>
<rect width="1920" height="1080" fill="url(#rain)"/>
<!-- foreground depth -->
<path d="M0 1000c190-38 365-35 550 30v50H0z" fill="#05070a"/><path d="M1470 1015c160-38 295-31 450 9v56h-450z" fill="#05070a"/>
</svg>