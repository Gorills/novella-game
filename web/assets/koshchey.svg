<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">Кощей</title><desc id="desc">Худой чёрный домашний кот с зелёными глазами, сидящий в естественной трёхчетвертной позе</desc>
<defs>
  <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c3036"/><stop offset=".24" stop-color="#181b20"/><stop offset=".64" stop-color="#090b0f"/><stop offset="1" stop-color="#030407"/></linearGradient>
  <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#363a40" stop-opacity=".72"/><stop offset="1" stop-color="#090b0f" stop-opacity="0"/></linearGradient>
  <radialGradient id="eye" cx="48%" cy="44%" r="58%"><stop stop-color="#e4ffd1"/><stop offset=".22" stop-color="#8bea70"/><stop offset=".7" stop-color="#3c9f4c"/><stop offset="1" stop-color="#153019"/></radialGradient>
  <filter id="eyeGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
