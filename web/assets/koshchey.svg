<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Кощей</title>
  <desc id="desc">Стройный чёрный домашний кот с небольшими ярко-зелёными глазами</desc>
  <defs>
    <linearGradient id="body" x1=".22" y1=".08" x2=".82" y2=".92">
      <stop offset="0" stop-color="#272a31"/>
      <stop offset=".28" stop-color="#15171d"/>
      <stop offset=".72" stop-color="#08090d"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7580" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#323640" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#eaffcf"/>
      <stop offset=".28" stop-color="#8df570"/>
      <stop offset=".68" stop-color="#3ab956"/>
      <stop offset="1" stop-color="#102718"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="367" cy="856" rx="182" ry="24" fill="#000" opacity=".5" filter="url(#shadow)"/>

  <!-- tail: long and natural, framing rather than mascot-like -->
  <path d="M470 690c93 12 159 70 151 137-4 37-29 64-70 72 31-20 44-45 38-74-10-48-58-77-132-76Z" fill="#08090d"/>
  <path d="M476 703c75 12 121 51 120 94" fill="none" stroke="#4a4f59" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/>

  <!-- seated body -->
  <path d="M277 385c-53 77-76 177-68 293 8 112 52 190 145 204 98 15 172-54 183-180 9-109-14-220-70-313-42-69-143-72-190-4Z" fill="url(#body)"/>
  <path d="M273 421c-29 91-34 190-14 296 10 55 30 94 60 119-70-26-99-91-106-177-7-104 14-193 60-238Z" fill="url(#rim)" opacity=".42"/>

  <!-- forelegs -->
  <path d="M286 588c-18 94-21 179-8 256 8 20 29 29 52 20 9-88 11-178 6-270Z" fill="#0b0c10"/>
  <path d="M415 588c5 92 8 182 18 270 25 8 43-2 49-22 10-78 5-160-16-248Z" fill="#090a0e"/>
  <path d="M273 855c12 15 35 17 65 7M426 856c17 13 40 14 64 3" fill="none" stroke="#454953" stroke-opacity=".24" stroke-width="4" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M301 355c10 54 20 88 35 110 29 18 65 17 94-1 17-29 27-64 31-107Z" fill="#111319"/>
  <path d="M268 222c-21-61-13-131 32-190 28 39 47 78 55 119 29-13 61-16 91-7 13-43 36-81 72-114 34 68 38 134 13 196 19 35 25 76 16 119-15 70-82 117-161 114-79-3-139-56-147-127-5-42 4-79 29-110Z" fill="url(#body)"/>

  <!-- ears, less exaggerated -->
  <path d="M286 188c-10-58-3-103 15-136 21 31 35 67 44 108Z" fill="#0a0b0f"/>
  <path d="M454 158c15-45 35-79 61-104 15 43 16 87 4 134Z" fill="#090a0d"/>
  <path d="M301 73c11 28 18 55 21 83M495 76c-13 28-21 56-24 85" fill="none" stroke="#6c6470" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>

  <!-- subtle muzzle -->
  <path d="M327 314c18 18 39 28 63 29 25 0 47-9 67-28-8 38-32 59-67 60-34 1-56-20-63-61Z" fill="#181a20" opacity=".72"/>
  <path d="M380 326c8-6 17-6 25 0-4 9-8 13-13 13-5 0-9-4-12-13Z" fill="#514851"/>
  <path d="M393 340c-3 11-11 17-24 19m24-19c4 10 12 16 25 17" fill="none" stroke="#77717a" stroke-opacity=".46" stroke-width="3" stroke-linecap="round"/>

  <!-- small almond eyes -->
  <path d="M310 270c23-20 48-20 71-2-20 26-46 27-71 2Z" fill="#030506"/>
  <path d="M410 267c22-18 47-17 69 3-25 24-49 23-69-3Z" fill="#030506"/>
  <path d="M323 270c14-10 29-10 43-1-12 14-27 14-43 1Z" fill="url(#eye)" filter="url(#glow)"/>
  <path d="M424 269c13-9 27-8 41 1-15 13-29 13-41-1Z" fill="url(#eye)" filter="url(#glow)"/>
  <path d="M344 261v18M445 261v18" stroke="#08120b" stroke-width="5" stroke-linecap="round"/>

  <!-- whiskers -->
  <g fill="none" stroke="#9ea0a7" stroke-opacity=".26" stroke-width="2.5" stroke-linecap="round">
    <path d="M344 329 205 307M345 341 191 342M348 351 220 382M440 327l137-28M439 340l149-1M436 351l126 36"/>
  </g>

  <!-- sparse fur highlights -->
  <g fill="none" stroke="#8d919b" stroke-opacity=".09" stroke-width="4" stroke-linecap="round">
    <path d="M272 459c39-25 78-36 117-33M455 458c-32-19-64-28-96-27M263 518c50-20 91-26 124-20M470 527c-37-16-73-22-108-18M294 651c29-12 56-16 82-11M447 652c-23-9-47-13-73-11"/>
  </g>
</svg>
