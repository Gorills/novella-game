  <path d="M286 368c48 54 103 78 166 74-30 83-85 126-166 110-45-33-59-94-40-150z" fill="#171a1e" opacity=".82"/>
  <path d="M451 438c67 10 127-11 179-64 30 64 15 126-42 174-76 22-124-14-137-110z" fill="#0b0e12" opacity=".86"/>
