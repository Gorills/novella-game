    <path d="M273 283c42-47 95-74 160-81M311 243c44-33 91-48 141-44M526 215c52 12 94 37 126 76M278 425c35-14 67-18 97-11M562 420c33-10 63-8 91 8M334 596c37 23 78 34 124 32M520 611c31-9 58-24 82-45" stroke-opacity=".13" stroke-width="7"/>
    <path d="M276 318l-54-22M287 336l-72-3M296 352l-69 21M626 318l64-28M619 338l78-1M607 357l72 25" stroke-opacity=".18" stroke-width="3"/>
  </g>
  <!-- whiskers -->
