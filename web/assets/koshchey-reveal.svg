  <path d="M530 363c28-20 58-16 88 15-34 25-63 20-88-15z" fill="url(#eye)" filter="url(#glow)"/>
  <path d="M376 342v46M574 348l-5 45" stroke="#071109" stroke-width="9" stroke-linecap="round"/>
