  <path d="M466 532c-6 22-22 36-47 43m47-43c8 21 24 34 49 39" stroke="#b1abb0" stroke-opacity=".48" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M304 360c46-44 99-43 149 5-47 52-99 51-149-5z" fill="#020304"/>
  <path d="M502 357c49-36 100-29 144 22-53 44-103 37-144-22z" fill="#020304"/>
