name: Materialize character assets

on:
  push:
    branches: [main]
    paths:
      - "web/assets/packed/**"
      - "tools/materialize_packed_assets.py"
      - ".github/workflows/materialize-character-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize assets
        run: python tools/materialize_packed_assets.py
      - name: Commit generated assets
        run: |
          if git diff --quiet -- web/assets/katerina.webp web/assets/egor.webp; then
            echo "Character assets already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/katerina.webp web/assets/egor.webp
          git commit -m "build: materialize character assets [skip ci]"
          git push
