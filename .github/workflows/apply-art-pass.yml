name: Apply art pass bundle

on:
  push:
    branches: [art-pass/egor-environments-v1]
    paths:
      - ".artpass/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production bundle
        run: |
          set -euo pipefail
          cat .artpass/chunk-* | base64 -d > /tmp/art-pass.tar.gz
          gzip -t /tmp/art-pass.tar.gz
          tar -xzf /tmp/art-pass.tar.gz
          rm -rf .artpass
      - name: Commit production art pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: lock Egor and add environment art pass"
          git push
